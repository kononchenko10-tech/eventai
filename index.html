<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EventAI - Генератор мероприятий</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(rgba(200, 235, 210, 0.85), rgba(160, 215, 170, 0.9)), 
                        url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }

        h2 { 
            text-align: center; 
            color: #1a1a1a; 
            font-size: 24px;
            margin-bottom: 25px;
        }

        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 500; 
            font-size: 14px; 
            color: #4a4a4a;
        }

        select, button, input[type="checkbox"] { margin-top: 6px; }

        select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #e0e0e0; 
            font-size: 15px; 
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        select:focus { border-color: #4CAF50; background-color: #fff; }

        .row { display: flex; gap: 15px; margin-top: 10px; }
        .col { flex: 1; }

        .checkbox-group { 
            margin-top: 20px; 
            padding: 15px; 
            background: #f8fdf9; 
            border: 1px solid #d1e7dd; 
            border-radius: 8px; 
        }

        .checkbox-group p { font-weight: 600; margin-top: 0; color: #1a1a1a; font-size: 15px; }

        .checkbox-group label { 
            font-weight: 400; display: flex; align-items: center; gap: 10px; 
            margin-top: 8px; font-size: 14px; cursor: pointer; color: #333;
        }

        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4CAF50; cursor: pointer; }

        button { 
            width: 100%; padding: 14px; background: #4CAF50; color: white; 
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 25px; transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.2);
        }

        button:hover { background: #43a047; transform: translateY(-1px); }
        button:disabled { background: #cccccc; cursor: not-allowed; box-shadow: none; transform: none; }

        #result { 
            margin-top: 25px; padding: 20px; background: #fdfdfd; 
            border: 1px solid #eeeeee; border-radius: 8px; min-height: 100px; 
            white-space: pre-wrap; line-height: 1.6; color: #333; font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Генератор мероприятий</h2>
    
    <label>Праздник:</label>
    <select id="holiday">
        <option value="Новый год">Новый год</option>
        <option value="1 сентября">1 сентября</option>
        <option value="День учителя">День учителя</option>
        <option value="8 марта">8 марта</option>
    </select>

    <div class="row">
        <div class="col">
            <label>От класса:</label>
            <select id="classFrom">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option>
            </select>
        </div>
        <div class="col">
            <label>До класса:</label>
            <select id="classTo">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11" selected>11</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Длительность:</label>
            <select id="duration">
                <option value="30 минут">30 минут</option>
                <option value="45 минут">45 минут</option>
                <option value="1 час" selected>1 час</option>
                <option value="1.5 часа">1.5 часа</option>
            </select>
        </div>
        <div class="col">
            <label>Бюджет:</label>
            <select id="budget">
                <option value="Без бюджета">Без бюджета (подручное)</option>
                <option value="Минимальный" selected>Минимальный</option>
                <option value="Средний">Средний</option>
            </select>
        </div>
    </div>

    <label style="margin-top: 15px;">Формат сценария:</label>
    <select id="format">
        <option value="short">Краткий план</option>
        <option value="detailed" selected>Подробный с диалогами</option>
    </select>

    <div class="checkbox-group">
        <p>Использовать цифровые технологии?</p>
        <label>
            <input type="checkbox" id="useTech"> 
            Да, использовать (мобильные устройства, QR-коды, онлайн-квизы)
        </label>
        <p style="font-size: 12px; color: #666; margin-top: 5px; margin-bottom: 0; font-weight: normal;">Если галочка не стоит, бот придумает только офлайн-игры без телефонов.</p>
    </div>

    <button id="genBtn">Сгенерировать мероприятие</button>
    <div id="result">Здесь появится сценарий...</div>
</div>

<script>
function cleanText(inputText) {
    var text = inputText;
    text = text.replace(/\*\*/g, "").replace(/#/g, "").replace(/\|/g, " ").replace(/---/g, "");
    text = text.replace(/^(Отлично!|Конечно!|Здравствуйте!|Привет!)[^\n]*\n+/i, "");
    text = text.replace(/^(Вот ваш|Вот сценарий|Я подготовил)[^\n]*\n+/i, "");
    text = text.replace(/\n+(Этот сценарий дает|Этот сценарий поможет|Надеюсь, этот сценарий|Удачи в организации)[\s\S]*$/i, "");
    text = text.replace(/\n{3,}/g, "\n\n");
    return text.trim();
}

document.getElementById("genBtn").onclick = async function() {
    var btn = this;
    var resultDiv = document.getElementById("result");
    
    btn.disabled = true;
    btn.innerText = "Генерирую... (подождите 15 сек)";
    resultDiv.innerText = "Анализирую базу и придумываю сценарий...";
    
    var holiday = document.getElementById("holiday").value;
    var classFrom = parseInt(document.getElementById("classFrom").value);
    var classTo = parseInt(document.getElementById("classTo").value);
    var duration = document.getElementById("duration").value;
    var budget = document.getElementById("budget").value;
    var format = document.getElementById("format").value;
    var useTech = document.getElementById("useTech").checked;
    
    if (classFrom > classTo) { var t = classFrom; classFrom = classTo; classTo = t; }
    var classDescription = (classFrom === classTo) ? (classFrom + " класс") : ("классы с " + classFrom + " по " + classTo);

    var csvUrl = "https://docs.google.com/spreadsheets/d/1c0uE0lfqJLFeHzI8g1oO1qhMa5MZrwesTTEvJLL1X8/export?format=tsv&gid=0";

    try {
        var csvResponse = await fetch(csvUrl);
        var csvText = await csvResponse.text();
        var rows = csvText.split("\n");
        
        // 1. СБОР ВСЕХ ПОДХОДЯЩИХ СЦЕНАРИЕВ (в массив)
        var validScripts = [];
        for (var i = 1; i < rows.length; i++) {
            if (!rows[i].trim()) continue;
            var cols = rows[i].split("\t");
            
            if (cols[0] && cols[0].includes(holiday)) {
                var dbNum = parseInt(cols[1] || "");
                if (!isNaN(dbNum) && dbNum >= classFrom && dbNum <= classTo) {
                    if (cols[7] && cols[7].length > 50) {
                        validScripts.push(cols[7]); // Сохраняем только текст
                    }
                }
            }
        }
        
        // 2. РАНДОМИЗАЦИЯ (Перемешиваем массив)
        validScripts.sort(function() { return 0.5 - Math.random(); });

        // 3. БЕРЕМ 2 СЛУЧАЙНЫХ СЦЕНАРИЯ И ОБРЕЗАЕМ ИХ
        var examples = "";
        var takeCount = Math.min(2, validScripts.length); // Берем максимум 2 штуки
        for (var j = 0; j < takeCount; j++) {
            examples += "Пример: " + validScripts[j].substring(0, 500) + "...\n\n";
        }
        
        if (examples === "") examples = "В базе нет точных примеров. Придумай сам.";

        // 4. Инструкции для нейросети
        var formatInstruction = (format === "detailed") 
            ? "Формат: ПОДРОБНЫЙ сценарий с репликами ведущих, диалогами и описанием действий." 
            : "Формат: КРАТКИЙ план по этапам (только тезисы и названия конкурсов).";
        
        var techConstraints = "";
        if (useTech) {
            techConstraints = "ОБЯЗАТЕЛЬНО включи в сценарий хотя бы один конкурс с использованием цифровых технологий (мобильные устройства, QR-коды или онлайн-квизы).";
        } else {
            techConstraints = "КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО использовать любые цифровые технологии (мобильные устройства, QR-коды, онлайн-квизы). Только офлайн-игры.";
        }

        var prompt = "Ты — опытный школьный методист. Напиши сценарий праздника '" + holiday + "' для " + classDescription + ".\n" +
        "ПАРАМЕТРЫ: Длительность — " + duration + ", Бюджет — " + budget + ".\n\n" +
        "КРИТИЧЕСКИ ВАЖНЫЕ ПРАВИЛА:\n" +
        "1. НЕ пиши вступления от себя! Начинай ответ СРАЗУ с заголовка.\n" +
        "2. НЕ пиши заключений и пожеланий в конце.\n" +
        "3. " + formatInstruction + "\n" +
        "4. " + techConstraints + "\n" +
        "5. Опирайся на стиль этих примеров из моей базы:\n" + examples + "\n" +
        "6. Пиши только на русском языке, без ошибок. Не используй символы ** и #.";

        // 5. Запрос к Z.ai
        var zaiKey = "4afa4a4d39614b6fa7513a65c6a56166.q1j4llhJlKjaSyka"; 
        
        var requestBody = {
            model: "glm-4.5-flash", 
            messages: [{ role: "user", content: prompt }],
            temperature: 0.7
        };

        var response = await fetch("https://api.z.ai/api/paas/v4/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + zaiKey,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestBody)
        });

        if (!response.ok) throw new Error("Код ошибки: " + response.status);

        var data = await response.json();
        resultDiv.innerText = cleanText(data.choices[0].message.content);
        
    } catch (error) {
        resultDiv.innerText = "Ошибка: " + error.message + "\n\nЕсли ошибка 429 — подождите 2-3 минуты и попробуйте снова.";
    } finally {
        btn.disabled = false;
        btn.innerText = "Сгенерировать мероприятие";
    }
};
</script>

</body>
</html>

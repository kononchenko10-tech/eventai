<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест 5-й строки</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #result { margin-top: 20px; padding: 15px; background: #eee; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Тест: берем 5-ю строку из таблицы</h2>
    <button id="genBtn">Показать сценарий</button>
    <div id="result">Здесь будет текст...</div>

    <script>
        document.getElementById("genBtn").onclick = async function() {
            var resultDiv = document.getElementById("result");
            resultDiv.innerText = "Загрузка...";

            // ССЫЛКА НА ТАБЛИЦУ (проверь, что она рабочая)
            var csvUrl = "https://docs.google.com/spreadsheets/d/1c0uE0IfqJLFeHzI8g1oOl1qhMa5MZrwesTTEvJLL1X8/edit?gid=0#gid=0";

            try {
                var response = await fetch(csvUrl);
                if (!response.ok) throw new Error("Ошибка сети: " + response.status);
                
                var csvText = await response.text();
                var rows = csvText.split("\n");
                
                // Берем 5-ю строку (индекс 4, так как первая строка - это заголовки)
                if (rows.length > 4) {
                    var cols = rows[4].split("\t");
                    // Берем 8-ю колонку (индекс 7 - это "Полный текст сценария")
                    var text = cols[7] || "В этой строке нет текста в 8-й колонке";
                    resultDiv.innerText = "Текст из 5-й строки:\n\n" + text;
                } else {
                    resultDiv.innerText = "В таблице меньше 5 строк!";
                }
            } catch (error) {
                resultDiv.innerText = "Ошибка: " + error.message;
            }
        };
    </script>
</body>
</html>

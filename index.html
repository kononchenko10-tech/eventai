<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventAI - Генератор</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e8f5e9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; }
        select, button { width: 100%; padding: 10px; margin-top: 10px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; background: #f9f9f9; min-height: 100px; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <h2>Генератор мероприятий</h2>
    <select id="holiday"><option value="Новый год">Новый год</option><option value="8 марта">8 марта</option></select>
    <button id="genBtn">Сгенерировать</button>
    <div id="result">Здесь появится сценарий...</div>
</div>

<!-- Скрытый iframe для обхода CORS -->
<iframe name="responseFrame" id="responseFrame" style="display:none;"></iframe>

<script>
document.getElementById("genBtn").onclick = function() {
    var btn = this;
    var resultDiv = document.getElementById("result");
    btn.disabled = true;
    btn.innerText = "Генерирую (15 сек)...";
    resultDiv.innerText = "Нейросеть думает...";
    
    var holiday = document.getElementById("holiday").value;
    var prompt = "Ты — школьный методист. Напиши подробный сценарий праздника '" + holiday + "' с конкурсами.";

    // ВСТАВЬ СВОЮ ССЫЛКУ ИЗ APPS SCRIPT (/exec)
    var scriptUrl = "https://script.google.com/macros/s/AKfycbwgTVaaCWgtwi8AZFZEfvOHA2J0QOaIqgyM8ouKM5C74rDCHK975rVVqsIHCDjLJKaqzA/exec"; 

    var form = document.createElement("form");
    form.method = "POST";
    form.action = scriptUrl;
    form.target = "responseFrame";

    var input = document.createElement("input");
    input.type = "hidden";
    input.name = "prompt";
    input.value = prompt;
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);

    var iframe = document.getElementById("responseFrame");
        iframe.onload = function() {
        try {
            // Берем просто текст, без парсинга JSON
            var text = iframe.contentDocument.body.innerText;
            resultDiv.innerText = text;
        } catch (e) {
            resultDiv.innerText = "Ошибка чтения ответа. Попробуйте еще раз.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Сгенерировать";
        }
    };
};
    </script>
</body>
</html>
